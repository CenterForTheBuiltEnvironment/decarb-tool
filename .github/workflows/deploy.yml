name: Test & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE: gcr.io/decarb-460017/decarb-tool

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest
        continue-on-error: true  # TODO: remove once test suite is complete

  deploy:
    name: Build & deploy to Cloud Run
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build image with Cloud Build
        run: gcloud builds submit --tag ${{ env.IMAGE }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy decarb-tool \
            --image ${{ env.IMAGE }} \
            --region us-central1 \
            --session-affinity \
            --cpu=2 \
            --memory=4Gi \
            --concurrency=8 \
            --max-instances=1
