steps:
  # Run integration tests (Tier 3) — full 8760h runs, gated before deployment
  - name: 'python:3.13-slim'
    entrypoint: bash
    args:
      - '-c'
      - 'pip install -r requirements.txt -q && python -m pytest -m integration -q --tb=short'
    id: 'run-integration-tests'
    waitFor: ['-']

  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/decarb-tool', '.']
    waitFor: ['run-integration-tests']

  # Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/decarb-tool']

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'decarb-tool'
      - '--image'
      - 'gcr.io/$PROJECT_ID/decarb-tool'
      - '--region'
      - 'us-west1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'
      - '--timeout'
      - '300'
      - '--concurrency'
      - '80'

images:
  - 'gcr.io/$PROJECT_ID/decarb-tool'
