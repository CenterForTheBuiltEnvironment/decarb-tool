repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: pytest-unit
        name: pytest (unit tests)
        entry: python -m pytest -m unit -x -q --tb=short
        language: system
        pass_filenames: false
        stages: [pre-commit]
