[project]
name = "decarb-tool"
version = "1.0.0"
description = "Building decarbonization planning tool"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "pages", "layout", "utils"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["src", "pages", "layout", "utils"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = [
  "unit: fast pure-function and invariant tests, no I/O (<10s total)",
  "regression: snapshot + invariant tests using real equipment library (~60s)",
  "integration: full 8760-hour end-to-end runs with real load data (2-5min)",
]
addopts = ["-v", "--tb=short", "-ra"]
